services:
  postgres:
    image: postgres:16-alpine
    container_name: prosthesis-postgres
    ports:
    - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-prosthesis_logger}
      POSTGRES_USER: ${DB_USER:-prosthesis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prosthesis_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prosthesis_user} -d ${DB_NAME:-prosthesis_logger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: prosthesis-app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data: